      <circle cx="9" cy="17" r="3" fill="currentColor"/><circle cx="6" cy="32" r="3" fill="currentColor"/><circle cx="9" cy="47" r="3" fill="currentColor"/>
      <path d="M43 12C45 23 51 30 61 32C51 34 45 41 43 52C41 41 35 34 25 32C35 30 41 23 43 12Z" fill="currentColor"/>
