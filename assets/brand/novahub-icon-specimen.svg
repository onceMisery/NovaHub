  <text x="64" y="106" fill="#5E6670" font-family="Segoe UI, sans-serif" font-size="15">分散能力汇聚成一次清晰的 Nova</text>
  <rect x="64" y="150" width="330" height="330" rx="24" fill="#202327"/>
  <use href="#mark" x="113" y="199" width="232" height="232"/>
  <text x="64" y="520" fill="#17191C" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600">Primary mark</text>
  <text x="64" y="546" fill="#5E6670" font-family="Segoe UI, sans-serif" font-size="13">能力节点 · 汇聚轨迹 · 中心 Nova</text>
  <text x="454" y="174" fill="#17191C" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">彩色标记 · 深色背景</text>
