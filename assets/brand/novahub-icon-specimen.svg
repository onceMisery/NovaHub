    <rect x="454" y="202" width="176" height="176" rx="18"/><rect x="662" y="250" width="128" height="128" rx="14"/><rect x="822" y="282" width="96" height="96" rx="11"/><rect x="950" y="314" width="64" height="64" rx="8"/><rect x="1046" y="346" width="32" height="32" rx="5"/>
  </g>
  <use href="#mark" x="478" y="226" width="128" height="128"/><use href="#mark" x="678" y="266" width="96" height="96"/><use href="#mark" x="838" y="298" width="64" height="64"/><use href="#mark" x="966" y="330" width="32" height="32"/><use href="#mark" x="1050" y="350" width="24" height="24"/>
