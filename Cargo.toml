[workspace]
resolver = "2"
members = [
    "architecture-tests",
    "xtask",
    "apps/novahub-app",
    "apps/novahub-cli",
    "apps/novahub-plugin-host",
    "plugins/official",
    "crates/core-domain",
    "crates/ipc",
    "crates/migration",
    "crates/plugin-manager",
    "crates/plugin-runtime",
    "crates/providers",
    "crates/search",
    "crates/storage",
    "crates/ui-protocol",
    "crates/ui-slint",
    "crates/platform/api",
    "crates/platform/windows",
    "crates/platform/macos",
    "sdk/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
